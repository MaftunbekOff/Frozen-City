[package]
name = "frozen_city"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.19"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# Playable performance in dev builds: optimize deps fully, own code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

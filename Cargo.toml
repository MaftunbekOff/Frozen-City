[package]
name = "frozen_city"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.19"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# Playable performance in dev builds: optimize deps fully, own code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.29.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent", "Window", "Location", "Navigator"] }

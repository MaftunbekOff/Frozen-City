[package]
name = "frozen_city"
version = "0.1.0"
edition = "2021"

[dependencies]
# `wav` adds the WAV decoder so the procedurally-synthesized SFX
# (src/client/audio.rs) can be decoded; bevy's default features are kept.
bevy = { version = "0.19", features = ["wav"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# Playable performance in dev builds: optimize deps fully, own code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.29.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGPU is the modern, much faster web backend (Bevy's GPU-driven fast path,
# like native Vulkan) — dramatically better than WebGL2 on mobile. Supported by
# Android Chrome 121+, Chrome/Edge/Firefox 2024+, Safari iOS 18+. Older browsers
# would need a separate WebGL2 build (see build-web.sh notes).
bevy = { version = "0.19", features = ["webgpu"] }
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent", "Window", "Location", "Navigator"] }

[workspace]
members = ["crates/fc-game", "crates/fc-net"]
resolver = "2"

[package]
name = "frozen_city"
version = "0.1.0"
edition = "2021"

[dependencies]
# `wav` adds the WAV decoder so the procedurally-synthesized SFX
# (src/client/audio.rs) can be decoded; `jpeg` decodes the survivor model's
# (assets/models/CesiumMan.glb) embedded JPEG texture; bevy's default
# features (which include webgl2) are kept.
bevy = { version = "0.19", features = ["wav", "jpeg"] }
fc-game = { path = "crates/fc-game" }
fc-net = { path = "crates/fc-net" }

[features]
# Built as a SEPARATE wasm bundle (see build-web.sh), never mixed into the
# default build: Bevy's WgpuSettings, when the `webgpu` feature is present,
# only checks that `navigator.gpu` *exists* before committing to it — real
# adapter acquisition can still fail (e.g. no GPU driver), and there is no
# automatic fallback to WebGL2 at that point, just a hard panic. boot.js picks
# between this bundle and the plain (default-features) WebGL2 one at runtime,
# after actually calling `navigator.gpu.requestAdapter()` — a real capability
# probe, not just a feature-presence check.
webgpu = ["bevy/webgpu"]

# Playable performance in dev builds: optimize deps fully, own code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Catches SIGTERM (systemd's `systemctl stop`/restart signal, also what a
# deploy swap sends) on the dedicated server so it can save the world before
# exiting instead of being killed mid-tick. "termination" is required for
# SIGTERM/SIGHUP — without it this crate only catches SIGINT (Ctrl+C).
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.103"
web-sys = { version = "0.3.103", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent", "Window", "Location", "Navigator", "Storage"] }

# tests/ and examples/ talk to fc-net's own dependencies directly (fabricating
# accounts-DB rows, decoding wire frames, etc.) rather than only through
# `frozen_city::net::...` re-exported types — same versions fc-net pins, kept
# in sync with crates/fc-net/Cargo.toml.
[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
bcrypt = "0.15"
tungstenite = "0.29.0"
bincode = "1.3"
# Parses the JSONL telemetry file in tests/telemetry_e2e.rs.
serde_json = "1"

[package]
name = "frozen_city"
version = "0.1.0"
edition = "2021"

[dependencies]
# `wav` adds the WAV decoder so the procedurally-synthesized SFX
# (src/client/audio.rs) can be decoded; bevy's default features (which
# include webgl2) are kept.
bevy = { version = "0.19", features = ["wav"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[features]
# Built as a SEPARATE wasm bundle (see build-web.sh), never mixed into the
# default build: Bevy's WgpuSettings, when the `webgpu` feature is present,
# only checks that `navigator.gpu` *exists* before committing to it — real
# adapter acquisition can still fail (e.g. no GPU driver), and there is no
# automatic fallback to WebGL2 at that point, just a hard panic. boot.js picks
# between this bundle and the plain (default-features) WebGL2 one at runtime,
# after actually calling `navigator.gpu.requestAdapter()` — a real capability
# probe, not just a feature-presence check.
webgpu = ["bevy/webgpu"]

# Playable performance in dev builds: optimize deps fully, own code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.29.0"
# OS CSPRNG for unguessable session/reconnect tokens (server-side only). The
# game RNG is a deterministic, invertible SplitMix64 and must NOT mint tokens.
getrandom = "0.2"
# Reads the accounts DB the registration Telegram bot writes to (server-side
# only). "bundled" compiles sqlite from source, so no system libsqlite3 dep.
rusqlite = { version = "0.31", features = ["bundled"] }
# Verifies passwords against the bcrypt hashes the bot stores.
bcrypt = "0.15"
# Catches SIGTERM (systemd's `systemctl stop`/restart signal, also what a
# deploy swap sends) on the dedicated server so it can save the world before
# exiting instead of being killed mid-tick. "termination" is required for
# SIGTERM/SIGHUP — without it this crate only catches SIGINT (Ctrl+C).
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent", "Window", "Location", "Navigator"] }

[package]
name = "fc-net"
version = "0.1.0"
edition = "2021"

[dependencies]
fc-game = { path = "../fc-game" }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
miniz_oxide = "0.9.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.29.0"
# OS CSPRNG for unguessable session/reconnect tokens (server-side only). The
# game RNG is a deterministic, invertible SplitMix64 and must NOT mint tokens.
getrandom = "0.2"
# Reads the accounts DB the registration Telegram bot writes to (server-side
# only). "bundled" compiles sqlite from source, so no system libsqlite3 dep.
rusqlite = { version = "0.31", features = ["bundled"] }
# Verifies passwords against the bcrypt hashes the bot stores.
bcrypt = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.103"
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent", "Window", "Location", "Navigator"] }

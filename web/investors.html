<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frozen City — Investor Taqdimoti</title>
<meta name="description" content="Frozen City — kooperativ survival city-builder. Investorlar uchun qisqa taqdimot (uz/en/ru)." />
<style>
  :root{
    --bg:#0a1220; --bg2:#0e1828; --card:#111d30; --sunken:#070d18;
    --ink:#e8f0f8; --dim:#9db0c4; --faint:#5d7288;
    --accent:#ff8a3d; --accent-soft:rgba(255,138,61,.14); --teal:#5adfcf;
    --line:rgba(232,240,248,.12); --line-soft:rgba(232,240,248,.06);
    --font-d:'Bahnschrift','Arial Narrow Bold','Segoe UI Semibold','Helvetica Neue',Arial,sans-serif;
    --font-b:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    --font-m:'Cascadia Mono',Consolas,'SF Mono',Menlo,'Ubuntu Mono',monospace;
    --fs-h1:clamp(2.6rem,5.2vw + 1rem,5.6rem);
    --fs-h2:clamp(1.6rem,2.2vw + .9rem,2.5rem);
    --fs-lead:clamp(1.05rem,.5vw + .95rem,1.3rem);
  }
  *{box-sizing:border-box}
  html{background:var(--bg);scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:1rem;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  h1,h2,h3{font-family:var(--font-d);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
  p{margin:0}
  a{color:var(--accent)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::selection{background:var(--accent);color:#1a0900}
  .wrap{max-width:1080px;margin:0 auto;padding-inline:clamp(1.25rem,4vw,3rem)}
  .eyebrow{font-family:var(--font-m);font-size:.72rem;text-transform:uppercase;letter-spacing:.18em;color:var(--accent)}
  .no{font-family:var(--font-m);font-size:.7rem;color:var(--faint);letter-spacing:.1em}
  .slide{padding-block:clamp(3.5rem,8vw,6.5rem);border-bottom:1px solid var(--line-soft)}
  .slide.alt{background:var(--bg2)}
  .slide-head{max-width:44rem;margin-bottom:clamp(2rem,5vw,3.5rem)}
  .slide-head h2{margin-top:.55rem;font-size:var(--fs-h2)}
  .slide-head .lead{margin-top:1rem;font-size:var(--fs-lead);color:var(--dim)}
  .brandmark{position:fixed;top:1.1rem;left:1.2rem;z-index:50;font-family:var(--font-m);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-decoration:none;background:rgba(10,18,32,.72);border:1px solid var(--line);padding:.45rem .7rem;backdrop-filter:blur(6px)}
  .brandmark:hover{color:var(--accent)}
  .lang-switch{position:fixed;top:1.1rem;right:1.2rem;z-index:50;display:flex;font-family:var(--font-m);font-size:.72rem;letter-spacing:.06em;background:rgba(10,18,32,.72);border:1px solid var(--line);backdrop-filter:blur(6px)}
  .lang-switch button{appearance:none;border:0;background:transparent;color:var(--faint);padding:.5rem .68rem;cursor:pointer;font:inherit;letter-spacing:inherit}
  .lang-switch button + button{border-left:1px solid var(--line)}
  .lang-switch button.active{color:#1a0900;background:var(--accent)}
  .lang-switch button:hover:not(.active){color:var(--ink)}
  .play-fab{position:fixed;bottom:1.15rem;right:1.2rem;z-index:50;display:inline-flex;align-items:center;gap:.55rem;background:var(--accent);color:#1a0900;text-decoration:none;font-family:var(--font-m);font-size:.78rem;letter-spacing:.05em;padding:.75rem 1.05rem;border:1px solid var(--accent);box-shadow:0 8px 28px rgba(255,138,61,.3)}
  .play-fab:hover{filter:brightness(1.07)}
  .play-fab .dot{width:6px;height:6px;border-radius:50%;background:#1a0900;flex:none}
  @media (prefers-reduced-motion:no-preference){
    .play-fab .dot{animation:pulse 1.8s ease-in-out infinite}
    .flame-pulse{animation:flame 2.6s ease-in-out infinite}
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes flame{0%,100%{opacity:1}50%{opacity:.72}}
  @media (max-width:640px){.brandmark{display:none}}
  .cover{position:relative;min-height:100svh;display:flex;align-items:flex-end;border-bottom:none;isolation:isolate;overflow:hidden}
  .cover svg.scene{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .cover .wrap{position:relative;z-index:2;width:100%;padding-block:clamp(3rem,7vw,5rem)}
  .cover-tag{display:inline-block;font-family:var(--font-m);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(90,223,207,.35);padding:.4rem .65rem;margin-bottom:1.2rem;background:rgba(7,13,24,.55)}
  .cover h1{font-size:var(--fs-h1);line-height:.94;margin-block:.7rem 1.1rem;text-shadow:0 2px 50px rgba(255,138,61,.25)}
  .cover .lead{max-width:38rem;font-size:var(--fs-lead);color:var(--dim);text-shadow:0 1px 18px rgba(7,13,24,.8)}
  .meta-row{margin-top:2.2rem;display:flex;flex-wrap:wrap;gap:1rem 2.6rem;font-family:var(--font-m);font-size:.8rem;color:var(--faint)}
  .meta-row b{color:var(--ink);font-weight:400}
  .cover-cta{display:inline-flex;align-items:center;gap:.6rem;margin-top:2.2rem;background:var(--accent);color:#1a0900;text-decoration:none;font-family:var(--font-m);font-size:.85rem;letter-spacing:.04em;padding:.85rem 1.35rem}
  .cover-cta:hover{filter:brightness(1.07)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:1rem}
  .card{background:var(--card);border:1px solid var(--line-soft);padding:1.4rem 1.3rem}
  .card .k{font-family:var(--font-d);font-size:1.35rem;color:var(--accent)}
  .card .k.teal{color:var(--teal)}
  .card p{margin-top:.5rem;color:var(--dim);font-size:.93rem}
  .cols2{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(2rem,5vw,3.5rem);align-items:center}
  @media (max-width:860px){.cols2{grid-template-columns:1fr}}
  .art{width:100%;height:auto;display:block}
  .art-frame{background:var(--sunken);border:1px solid var(--line-soft);padding:1rem}
  .art-cap{font-family:var(--font-m);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:.7rem}
  .gap-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
  .gap-card{background:var(--card);border:1px solid var(--line-soft);padding:1.5rem 1.3rem}
  .gap-card.hole{border:1px dashed rgba(255,138,61,.5);background:var(--accent-soft)}
  .gap-card h3{font-size:1.05rem;margin-bottom:.55rem}
  .gap-card p{color:var(--dim);font-size:.93rem}
  .gap-card svg{display:block;margin-bottom:.9rem}
  .close-line{margin-top:2rem;max-width:46rem;font-size:var(--fs-lead);color:var(--ink)}
  .loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-top:1.6rem}
  .loop .step{border-left:2px solid var(--accent);padding:.2rem 0 .2rem 1rem}
  .loop .step b{font-family:var(--font-d);display:block;margin-bottom:.25rem}
  .loop .step span{color:var(--dim);font-size:.9rem}
  .content-row{margin-top:2.2rem;display:flex;flex-wrap:wrap;gap:1rem 2.4rem;font-family:var(--font-m);font-size:.8rem;color:var(--dim)}
  .content-row b{color:var(--teal);font-weight:400}
  .tbl-scroll{overflow-x:auto;border:1px solid var(--line-soft)}
  table.cmp{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
  .cmp th,.cmp td{padding:.85rem 1rem;text-align:center;border-bottom:1px solid var(--line-soft)}
  .cmp th{font-family:var(--font-m);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--sunken)}
  .cmp td:first-child,.cmp th:first-child{text-align:left}
  .cmp td:first-child{color:var(--dim)}
  .cmp .fc{background:rgba(255,138,61,.06)}
  .cmp th.fc{color:var(--accent)}
  .yes{color:var(--teal);font-weight:700}
  .no-x{color:var(--faint)}
  .part{color:var(--dim)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem}
  .stat{background:var(--card);border:1px solid var(--line-soft);padding:1.4rem 1.3rem}
  .stat .v{font-family:var(--font-d);font-size:clamp(2rem,3vw,2.8rem);color:var(--accent);line-height:1}
  .stat .v small{font-size:55%}
  .stat p{margin-top:.45rem;color:var(--dim);font-size:.88rem}
  .infra{margin-top:1.6rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.55rem 2rem;padding:0;list-style:none;color:var(--dim);font-size:.93rem}
  .infra li::before{content:"◆ ";color:var(--teal);font-size:.7em}
  .eras{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}
  .era{background:var(--card);border:1px solid var(--line-soft);padding:1.3rem;text-align:center}
  .era svg{display:block;margin:0 auto .8rem}
  .era h3{font-size:1rem}
  .era .res{font-family:var(--font-m);font-size:.7rem;color:var(--teal);margin:.35rem 0 .5rem;letter-spacing:.04em}
  .era p{color:var(--dim);font-size:.88rem}
  .badge{display:inline-block;font-family:var(--font-m);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:.22rem .5rem;margin-bottom:.7rem}
  .badge.live{color:#1a0900;background:var(--teal)}
  .badge.plan{color:var(--dim);border:1px solid var(--line)}
  .climate{margin-top:2.2rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
  .clim{border:1px solid var(--line-soft);padding:1.2rem 1.3rem;display:flex;gap:1rem;align-items:flex-start;background:var(--sunken)}
  .clim svg{flex:none;margin-top:.15rem}
  .clim b{font-family:var(--font-d);display:block}
  .clim span{color:var(--dim);font-size:.88rem}
  .bridge{margin-top:1.8rem;color:var(--dim);max-width:46rem;font-size:.95rem;border-left:2px solid var(--teal);padding-left:1rem}
  .road{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
  .road .col{background:var(--card);border-top:2px solid var(--accent);padding:1.3rem}
  .road .col:nth-child(2){border-top-color:var(--teal)}
  .road .col:nth-child(3){border-top-color:var(--dim)}
  .road .k{font-family:var(--font-m);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .road h3{margin:.4rem 0 .7rem;font-size:1.05rem}
  .road ul{margin:0;padding-left:1.1rem;color:var(--dim);font-size:.9rem}
  .road li{margin-bottom:.45rem}
  .ask-box{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(2rem,5vw,3.5rem);align-items:center}
  @media (max-width:860px){.ask-box{grid-template-columns:1fr}}
  .ask-box .big{font-size:var(--fs-lead);color:var(--ink);max-width:34rem}
  .ask-box .note{margin-top:1rem;color:var(--dim);font-size:.95rem}
  .ask-ctas{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
  .btn{display:inline-flex;align-items:center;gap:.55rem;text-decoration:none;font-family:var(--font-m);font-size:.82rem;letter-spacing:.04em;padding:.8rem 1.2rem}
  .btn.primary{background:var(--accent);color:#1a0900}
  .btn.ghost{border:1px solid var(--line);color:var(--ink)}
  .btn:hover{filter:brightness(1.08)}
  footer{padding:2.2rem 0 5.5rem;font-family:var(--font-m);font-size:.72rem;color:var(--faint);letter-spacing:.06em}
  footer .wrap{display:flex;flex-wrap:wrap;gap:.6rem 2rem;justify-content:space-between}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.play-fab .dot,.flame-pulse{animation:none}}
</style>
</head>

<!-- ================================================== 01 SUMMARY -->
<section class="slide" id="s1">
  <div class="wrap">
    <div class="slide-head"><span class="no">01</span>
      <div class="eyebrow" data-i18n="s1.eyebrow"></div><h2 data-i18n="s1.h2"></h2></div>
    <div class="cols2">
      <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
        <div class="card"><div class="k teal" data-i18n="s1.c1.k"></div><p data-i18n="s1.c1.d"></p></div>
        <div class="card"><div class="k" data-i18n="s1.c2.k"></div><p data-i18n="s1.c2.d"></p></div>
        <div class="card"><div class="k" data-i18n="s1.c3.k"></div><p data-i18n="s1.c3.d"></p></div>
        <div class="card"><div class="k teal" data-i18n="s1.c4.k"></div><p data-i18n="s1.c4.d"></p></div>
      </div>
      <div class="art-frame">
        <svg class="art" viewBox="0 0 640 360" aria-hidden="true">
          <g>

  "c.m1":"Janr — <b>Kooperativ survival city-builder</b>","c.m2":"Texnologiya — <b>Rust + Bevy</b>","c.m3":"Platformalar — <b>Desktop / Web / Mobil</b>","c.m4":"Holat — <b>Jonli, o'ynash mumkin</b>",

  "s2.c2.t":"Mobil klonlar","s2.c2.d":"Telefon o'yinlari (ba'zilari aynan \"Frozen City\" nomi bilan) ulkan auditoriyani oladi, lekin sayoz, yakka idle-tsikllar.",
  "s2.c3.t":"Bo'shliq","s2.c3.d":"Do'stingiz bitta havolani bosib, brauzerda aynan siz qurayotgan shaharga real vaqtda qo'shila oladigan mahsulot janrda deyarli yo'q.",
  "s2.close":"Frozen City bu bo'shliqni \"chuqur yoki qulay\" degan kelishuv bilan emas, bitta simulyatsiyani barcha platformada birdek ishlatish bilan yopadi.",
  "s3.eyebrow":"Mahsulot","s3.h2":"Bitta Pechka. Abadiy qish. Shahar birga omon qoladi — yoki birga halok bo'ladi.",
  "s3.lead":"Bir hovuch omon qolganlar yagona Pechka atrofida to'planadi; harorat kundan-kunga tushib boradi. Pechka darajasi issiqlik radiusini belgilaydi — yoqilg'i tugasa, boshpana ham toraya boradi.",
  "s3.l1.t":"To'plash","s3.l1.d":"O'tin, ko'mir va oziq-ovqat — lager atrofidagi yerlardan.",
  "s3.l2.t":"Qurish","s3.l2.d":"Chodirdan tortib teplitsa, gospital va omborgacha — har birida o'z xodimi.",
  "s3.l3.t":"Pechkani yoqish","s3.l3.d":"Darajasi issiqlik radiusini beradi; yoqilg'i tugasa radius — va boshpana — qisqaradi.",
  "s3.l4.t":"Tunni o'tkazish","s3.l4.d":"Keskin sovuqlar, bo'ronlar, kasallik va darvoza oldidagi notanishlar haqida og'ir qarorlar.",
  "s3.n1":"bino turi, yaxshilanadigan va ko'chiriladigan","s3.n2":"kasb, tajriba va darajalar bilan","s3.n3":"tarmoqli texnologiya daraxti","s3.n4b":"Tunnel","s3.n4":"— shaxsiy dunyoni yakunlovchi megaloyiha",
  "s3.cap":"Pechka va issiqlik radiusi — o'yinning markaziy mexanikasi",

  "s4.note":"Raqobat yo'nalishi — yakka o'yin chuqurligida to'qnashish emas: kooperatsiya va chinakam kross-platforma qamrovida ustunlik.",
  "s5.eyebrow":"Bugungi holat","s5.h2":"Bu reja emas — ishlab turgan tizim.",

  "s6.lead":"Bugungi qishki omon qolish — birinchi bob xolos. Reja: o'sha shahar, o'sha tekshirilgan simulyatsiya ustida to'rt sivilizatsiya davridan o'tadi.",
  "badge.live":"Bugun jonli","badge.plan":"Rejada",
  "s6.e1.t":"Ibtidoiy qabila","s6.e1.r":"Olov · yog'och · tosh","s6.e1.d":"Valyuta yo'q — hamma narsa umumiy omborda. Aynan bugun ishlab turgan bosqich.",
  "s6.e2.t":"Qishloq","s6.e2.r":"G'isht · ruda · bug'doy · chorva","s6.e2.d":"Doimiy uy-joy, teplitsalar, quduqlar. Dehqon, chorvador, konchi kasblari.",
  "s6.e3.t":"Sanoat shahri","s6.e3.r":"Ko'mir · neft · metall · elektr","s6.e3.d":"Valyuta paydo bo'ladi: maosh va savdo. Fabrikalar, kasalxonalar.",

  "s6.cl1.t":"Sovuq fasl — Muz","s6.cl1.d":"Sovuq urishi va ochlik; pechka, teplitsa, issiq kiyim ishlab chiqarishni talab qiladi.",

  "s6.bridge":"Bularning bari qayta yozish emas — o'sha tekshirilgan deterministik yadro ustiga qo'shimcha kontent sifatida, V0.2–V0.7 ni chiqargan intizom bilan bosqichma-bosqich qo'shiladi.",

en: {
  "nav.back":"← Frozen City","play.cta":"Play",
  "c.tag":"game.twelfth.uz — live now","c.eyebrow":"Investor briefing",
  "c.lead":"A cooperative survival city-builder in the endless winter. One Rust codebase running on desktop, in the browser and on phones — with true server-authoritative real-time multiplayer.",
  "c.m1":"Genre — <b>Co-op survival city-builder</b>","c.m2":"Tech — <b>Rust + Bevy</b>","c.m3":"Platforms — <b>Desktop / Web / Mobile</b>","c.m4":"Status — <b>Live and playable</b>",
  "c.cta":"Try it now →",
  "s1.eyebrow":"Summary","s1.h2":"The whole deck in four cards.",
  "s1.c1.k":"Live","s1.c1.d":"game.twelfth.uz is not a mockup: a working product with accounts, persistent worlds and production infrastructure.",
  "s1.c2.k":"1 codebase","s1.c2.d":"The same Rust code runs natively on desktop, in the browser (WebGPU with WebGL2 fallback) and in mobile browsers.",
  "s1.c3.k":"Real-time co-op","s1.c3.d":"One server-authoritative city: no device can fake progress. Traffic is delta snapshots — only what changed.",
  "s1.c4.k":"0 art budget","s1.c4.d":"All visuals are generated procedurally by code — this look was achieved with no content spend.",
  "s1.cap":"One simulation — three platforms around one server",
  "s2.eyebrow":"Problem","s2.h2":"The genre proved demand — then split it three ways.",
  "s2.c1.t":"Desktop classics","s2.c1.d":"Frostpunk, Banished, They Are Billions — deep simulation, but single-player, bought and installed before anyone sees the game.",
  "s2.c2.t":"Mobile clones","s2.c2.d":"Phone games (some literally named \"Frozen City\") reach a huge casual audience but are shallow single-player idle loops.",
  "s2.c3.t":"The gap","s2.c3.d":"Almost nothing in the genre lets a friend click one link and start building the same city with you, in real time, from any device.",
  "s2.close":"Frozen City closes that gap not by trading depth for reach, but by running the same simulation on every platform at once.",
  "s3.eyebrow":"Product","s3.h2":"One Furnace. Endless winter. The city survives together — or falls together.",
  "s3.lead":"A handful of survivors gathers around a single Furnace as the temperature drops day after day. The furnace level sets the heat radius — run out of fuel and the shelter itself shrinks.",
  "s3.l1.t":"Gather","s3.l1.d":"Wood, coal and food from the lands around camp.",
  "s3.l2.t":"Build","s3.l2.d":"From tents to greenhouses, a hospital and a warehouse — each with its own staff.",
  "s3.l3.t":"Feed the Furnace","s3.l3.d":"Its level sets the heat radius; when fuel runs out, the radius — and shelter — contracts.",
  "s3.l4.t":"Survive the night","s3.l4.d":"Cold snaps, blizzards, sickness and hard choices about strangers at the gate.",
  "s3.n1":"building types, upgradeable and relocatable","s3.n2":"professions with XP and levels","s3.n3":"tech-tree branches","s3.n4b":"Tunnel","s3.n4":"— the megaproject crowning a personal world",
  "s3.cap":"The Furnace and its heat radius — the core mechanic",
  "s4.eyebrow":"Differentiation","s4.h2":"No one in the genre offers this combination.",
  "s4.th0":"Capability","s4.th1":"Desktop classics","s4.th2":"Mobile clones","s4.part":"partial",
  "s4.r1":"Real-time co-op multiplayer","s4.r2":"3 platforms from one codebase","s4.r3":"Instant play via a link","s4.r4":"Simulation depth","s4.r5":"Server-authoritative shared world",
  "s4.note":"The strategy is not to out-depth single-player titles — it is to win on co-op and true cross-platform reach.",
  "s5.eyebrow":"Where it stands","s5.h2":"Not a plan — a running system.",
  "s5.s1":"concurrent players in one shared hub — load-tested",
  "s5.s2":"automated test files — a mandatory gate before every deploy",
  "s5.s3":"web download with gzip (optimized WASM: 34 MB)",
  "s5.s4":"languages — Uzbek, English, Russian: fully localized UI",
  "s5.i1":"Accounts, persistent personal worlds and a guest mode",
  "s5.i2":"A proven automated deploy pipeline: test → build → smoke-test → swap",
  "s5.i3":"A living economy: hunting, livestock, caravan trade",
  "s5.i4":"Leader, morale and profession-XP systems",
  "s5.i5":"Relocating constructed buildings — rare in the genre",
  "s5.i6":"Procedural, profession-matched character models",
  "s6.eyebrow":"Long-term vision","s6.h2":"From one campfire to a modern state.",
  "s6.lead":"Today's winter survival run is only the first chapter. The plan: the same city, on the same proven simulation, advances through four eras of civilization.",
  "badge.live":"Live today","badge.plan":"Planned",
  "s6.e1.t":"Primitive tribe","s6.e1.r":"Fire · wood · stone","s6.e1.d":"No currency — everything in a shared stockpile. Exactly what runs today.",
  "s6.e2.t":"Village","s6.e2.r":"Brick · ore · wheat · livestock","s6.e2.d":"Permanent housing, greenhouses, wells. Farmers, herders and miners appear.",
  "s6.e3.t":"Industrial city","s6.e3.r":"Coal · oil · metal · electricity","s6.e3.d":"Currency arrives: wages and trade. Factories and hospitals.",
  "s6.e4.t":"Modern metropolis","s6.e4.r":"High tech · nuclear/hydro · finance","s6.e4.d":"A full fiscal system, smart buildings, floating megastructures.",
  "s6.cl1.t":"Cold season — Ice","s6.cl1.d":"Frostbite and famine; demands the furnace, greenhouses and warm-clothing production.",
  "s6.cl2.t":"Hot season — Heat","s6.cl2.d":"Water scarcity and fires; demands reservoirs, irrigation and cooling structures.",
  "s6.cl3.t":"Flood season — Water","s6.cl3.d":"Land goes underwater; relocation to high ground, floating platforms, hydroponics.",
  "s6.bridge":"None of this is a rewrite — it lands as content on top of the same proven deterministic core, shipped milestone by milestone with the discipline that delivered V0.2–V0.7.",
  "s7.eyebrow":"Roadmap","s7.h2":"What the next investment buys.",
  "s7.c1.k":"Near term","s7.c1.t":"Ship readiness","s7.c1.i1":"CI/CD — one tag, five platform artifacts","s7.c1.i2":"A further WASM size-reduction pass","s7.c1.i3":"Localizing the last surface: server text",
  "s7.c2.k":"Mid term","s7.c2.t":"Distribution","s7.c2.i1":"A public storefront page: screenshots, trailer, playable web build","s7.c2.i2":"First paid user-acquisition channel","s7.c2.i3":"A marketplace on top of the existing contribution ledger",
  "s7.c3.k":"Scale","s7.c3.t":"Headroom","s7.c3.i1":"100 concurrent players in one hub — already load-tested","s7.c3.i2":"Interest management / sharding for 1,000+ concurrent","s7.c3.i3":"A multi-region world manager",
  "s8.eyebrow":"The ask","s8.h2":"The next step is a conversation.",
  "s8.big":"Investment amount, instrument and use of funds are agreed in a meeting. The product itself is already live — you can open it and play right now.",
  "s8.note":"A technical deep-dive (architecture, codebase, infrastructure) is available on request.",
  "s8.cta1":"Get in touch — twelfth.uz","s8.cta2":"Open the game",
  "f.l":"Frozen City — Investor briefing"
},
ru: {
  "nav.back":"← Frozen City","play.cta":"Играть",
  "c.tag":"game.twelfth.uz — уже работает","c.eyebrow":"Брифинг для инвесторов",
  "c.lead":"Кооперативный сити-билдер на выживание в бесконечную зиму. Одна кодовая база на Rust — на десктопе, в браузере и на телефонах, с настоящим сервер-авторитативным мультиплеером в реальном времени.",
  "c.m1":"Жанр — <b>Кооп survival-сити-билдер</b>","c.m2":"Технологии — <b>Rust + Bevy</b>","c.m3":"Платформы — <b>Десктоп / Веб / Мобильные</b>","c.m4":"Статус — <b>Работает, можно играть</b>",
  "c.cta":"Попробовать →",
  "s1.eyebrow":"Кратко","s1.h2":"Вся презентация — в четырёх карточках.",
  "s1.c1.k":"Live","s1.c1.d":"game.twelfth.uz — не макет: работающий продукт с аккаунтами, сохраняемыми мирами и продакшн-инфраструктурой.",
  "s1.c2.k":"1 кодовая база","s1.c2.d":"Один и тот же Rust-код работает нативно на десктопе, в браузере (WebGPU с откатом на WebGL2) и в мобильных браузерах.",
  "s1.c3.k":"Кооп в реальном времени","s1.c3.d":"Один сервер-авторитативный город: ни одно устройство не может подделать прогресс. Трафик — только изменения (дельта-снапшоты).",
  "s1.c4.k":"0 затрат на арт","s1.c4.d":"Вся графика генерируется кодом процедурно — этот облик достигнут без контент-бюджета.",
  "s1.cap":"Одна симуляция — три платформы вокруг одного сервера",
  "s2.eyebrow":"Проблема","s2.h2":"Жанр доказал спрос — и разделил его натрое.",
  "s2.c1.t":"Десктопная классика","s2.c1.d":"Frostpunk, Banished, They Are Billions — глубокая симуляция, но одиночная: покупка и установка прежде, чем кто-то увидит игру.",
  "s2.c2.t":"Мобильные клоны","s2.c2.d":"Игры для телефонов (некоторые буквально называются \"Frozen City\") берут огромную аудиторию, но это неглубокие одиночные idle-циклы.",
  "s2.c3.t":"Разрыв","s2.c3.d":"Почти ничто в жанре не даёт другу кликнуть одну ссылку и строить тот же город вместе с вами в реальном времени — с любого устройства.",
  "s2.close":"Frozen City закрывает разрыв не компромиссом между глубиной и доступностью, а запуском одной симуляции сразу на всех платформах.",
  "s3.eyebrow":"Продукт","s3.h2":"Одна Печь. Бесконечная зима. Город выживает вместе — или гибнет вместе.",
  "s3.lead":"Горстка выживших собирается вокруг единственной Печи, пока температура падает день за днём. Уровень печи задаёт радиус тепла — кончится топливо, и укрытие сожмётся.",
  "s3.l1.t":"Собирать","s3.l1.d":"Дрова, уголь и еду с земель вокруг лагеря.",
  "s3.l2.t":"Строить","s3.l2.d":"От палаток до теплиц, госпиталя и склада — у каждого здания свой персонал.",
  "s3.l3.t":"Топить печь","s3.l3.d":"Уровень задаёт радиус тепла; кончится топливо — радиус и укрытие сократятся.",
  "s3.l4.t":"Пережить ночь","s3.l4.d":"Похолодания, бураны, болезни и трудные решения о незнакомцах у ворот.",
  "s3.n1":"типов зданий, улучшаемых и переносимых","s3.n2":"профессий с опытом и уровнями","s3.n3":"веток дерева технологий","s3.n4b":"Туннель","s3.n4":"— мегапроект, венчающий личный мир",
  "s3.cap":"Печь и радиус тепла — центральная механика игры",
  "s4.eyebrow":"Отличие","s4.h2":"Никто в жанре не предлагает эту комбинацию.",
  "s4.th0":"Возможность","s4.th1":"Десктопная классика","s4.th2":"Мобильные клоны","s4.part":"частично",
  "s4.r1":"Кооп-мультиплеер в реальном времени","s4.r2":"3 платформы из одной кодовой базы","s4.r3":"Мгновенная игра по ссылке","s4.r4":"Глубина симуляции","s4.r5":"Сервер-авторитативный общий мир",
  "s4.note":"Стратегия — не соревноваться в глубине одиночной игры, а выигрывать на коопе и настоящей кроссплатформенности.",
  "s5.eyebrow":"Текущий статус","s5.h2":"Это не план — это работающая система.",
  "s5.s1":"одновременных игроков в одном хабе — нагрузочный тест пройден",
  "s5.s2":"файлов автотестов — обязательный шлюз перед каждым деплоем",
  "s5.s3":"веб-загрузка с gzip (оптимизированный WASM: 34 МБ)",
  "s5.s4":"языка — узбекский, английский, русский: полностью локализованный интерфейс",
  "s5.i1":"Аккаунты, сохраняемые личные миры и гостевой режим",
  "s5.i2":"Проверенный автодеплой: тесты → сборка → smoke-тест → замена",
  "s5.i3":"Живая экономика: охота, скотоводство, караванная торговля",
  "s5.i4":"Системы лидера, морали и профессионального опыта",

(function(){
  const KEY="fc_inv_lang";
  const btns=document.querySelectorAll(".lang-switch button");
  function apply(lang){
    if(!I18N[lang]) lang="uz";
    const d=I18N[lang];
    document.documentElement.lang=lang;
    document.querySelectorAll("[data-i18n]").forEach(el=>{
      const k=el.getAttribute("data-i18n");
      if(d[k]!==undefined) el.innerHTML=d[k];
    });
    btns.forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
    try{localStorage.setItem(KEY,lang);}catch(e){}
  }
  btns.forEach(b=>b.addEventListener("click",()=>apply(b.dataset.lang)));
  let saved="uz";
  try{saved=localStorage.getItem(KEY)||"uz";}catch(e){}
  apply(saved);
})();
</script>
